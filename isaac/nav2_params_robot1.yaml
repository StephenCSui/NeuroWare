# Nav2 params for Robot 1, adapted from the real installed Nav2 Humble
# default (/opt/ros/humble/share/nav2_bringup/params/nav2_params.yaml) --
# not written from scratch. Meant to be launched with
# `ros2 launch nav2_bringup navigation_launch.py` (NOT bringup_launch.py --
# no AMCL/map_server here, since this robot has ground-truth odometry
# from the sim, no localization/SLAM needed). global_frame is "odom"
# everywhere instead of "map" for the same reason -- odom IS the map in
# this setup, and both costmaps use rolling_window instead of a static
# map layer.
#
# Robot geometry: robot_radius 0.168 = hypot(0.15, 0.075), the real
# chassis half-extents from base.usda (confirmed earlier this session,
# same value as occupancy_grid.rotation_swept_radius() with no cargo).
# Speed limits: this robot's real max wheel speed is ~5 rad/s * 0.04m
# wheel radius = ~0.2 m/s (Base_speed/WHEEL_RADIUS used throughout this
# session's other scripts) -- much slower than the turtlebot3 defaults
# (0.26 m/s) this file was adapted from, so velocity/acceleration/
# "stopped" thresholds are all scaled down accordingly, not left at
# turtlebot3 scale.

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2   # scaled down from 0.5 -- this
                                        # robot's whole world is ~5.5m
                                        # across, project convention is
                                        # small-scale/tight tolerances
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1          # tighter than the 0.25 default,
      yaw_goal_tolerance: 0.15        # matching this project's small-
                                        # scale/tight-tolerance convention
                                        # (not as tight as the hand-rolled
                                        # scripts' 0.01m/0.002rad, since
                                        # that's Nav2's own controller
                                        # precision, not our exact-turn
                                        # primitive)
    # Switched from DWB to Regulated Pure Pursuit this session. DWB samples
    # combined (vx, vtheta) arcs by design -- on this skid-steer chassis
    # that produced slow, curving turn-while-driving motion instead of a
    # clean rotate-then-drive, and live testing showed it repeatedly
    # failing to converge (12x "Failed to make progress" in one run,
    # cmd_vel_nav pinned at max rotation with non-converging yaw). RPP's
    # use_rotate_to_heading gives an explicit stop-rotate-drive behavior
    # instead. Note: use_rotate_to_heading and allow_reversing are
    # mutually exclusive in RPP (the controller forces allow_reversing
    # off with a warning if both are set) -- confirmed user priority is
    # no-arcing over reverse-while-driving, so allow_reversing stays
    # false here. The BackUp recovery behavior (behavior_server, below)
    # still provides reverse motion when the robot is stuck, unaffected
    # by this choice.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15        # same real-max-derived cap used by
                                        # the old DWB config
      rotate_to_heading_angular_vel: 1.0   # matches old max_vel_theta
      max_angular_accel: 25.0         # was 1.5, then 6.0 -- live-tested
                                        # this session: RPP's rotate-to-
                                        # heading ramp steps up from the
                                        # REAL odom-measured current
                                        # speed each cycle (controller_
                                        # frequency=20, dt=0.05s), not
                                        # from the last commanded value
                                        # or a persistent ramp state. As
                                        # long as achieved velocity lags
                                        # (chassis still building up
                                        # rotational momentum -- confirmed
                                        # this needs several real seconds
                                        # of a held-CONSTANT command, via
                                        # a clean raw /cmd_vel test that
                                        # converged to ~0.39 rad/s over
                                        # ~4-5s), every cycle recomputes
                                        # the SAME small step from that
                                        # same near-zero base, capping the
                                        # command at accel*dt forever
                                        # instead of ever reaching
                                        # rotate_to_heading_angular_vel.
                                        # At 6.0 that cap was ~0.3 rad/s
                                        # (measured: real yaw barely
                                        # moved, 0.67deg over 10s, despite
                                        # a "stable-looking" 0.25-0.3
                                        # rad/s command). 25.0 makes
                                        # accel*dt=1.25 > target(1.0), so
                                        # the very first cycle already
                                        # clamps to the full target
                                        # regardless of the stalled
                                        # feedback base -- skips the
                                        # incremental-ramp trap entirely.
      transform_tolerance: 0.2
      use_rotate_to_heading: True
      rotate_to_heading_min_angle: 0.785   # RPP default (~45deg) --
                                        # not yet live-tuned for this
                                        # robot, revisit if it rotates
                                        # more/less often than expected
      allow_reversing: False
      lookahead_dist: 0.3             # first-pass value scaled to this
                                        # ~5.5x6.5m world, not yet live-
                                        # tuned
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.4
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: False
      min_approach_linear_velocity: 0.03   # scaled down from RPP's 0.05
                                        # default in proportion to this
                                        # robot's lower desired_linear_vel
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: True
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: True
      use_cost_regulated_linear_velocity_scaling: False
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      use_fixed_curvature_lookahead: False
      use_interpolation: True
      max_robot_pose_search_dist: 3.0 # matches SCAN_MAX_RANGE

# No static_layer/map_server -- this robot has no prebuilt map, only
# live sensing (the /scan topic synthesized from the 4 corner depth
# cameras, see nav2_bridge_robot1.py). rolling_window replaces the need
# for fixed map bounds.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 6                        # >= 2x SCAN_MAX_RANGE (3.0m) so
      height: 6                        # the full scan radius fits
      resolution: 0.05
      robot_radius: 0.168
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25         # scaled down from 0.55 -- this
                                         # robot/world is small-scale,
                                         # project convention is tight
                                         # tolerances, not a wide margin.
                                         # Must exceed the robot's real
                                         # inscribed radius (Nav2 computed
                                         # 0.174 from robot_radius=0.168 --
                                         # confirmed live via a real
                                         # startup warning when this was
                                         # 0.15, smaller than that) or the
                                         # inflation zone never actually
                                         # extends past the robot's own
                                         # body.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0      # matches SCAN_MAX_RANGE
          raytrace_min_range: 0.0
          obstacle_max_range: 2.8
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      # Session 15: was 0.168 (bare chassis, hypot(0.15,0.075)) -- but
      # planner_server is ONLY ever invoked by rotate_drive_controller.py's
      # carrying-aware /goal_pose_carry_planned leg in the current
      # shelf_transfer_task.py design (the plain /goal_pose/
      # /goal_pose_approach topics exist but are unused). A bare-chassis
      # robot_radius here meant NavfnPlanner could legitimately return
      # low-cost paths passing as close as ~0.168-0.25m from an obstacle --
      # well inside rotate_drive_controller.py's own carrying-aware
      # CARRY_OBSTACLE_STOP_RANGE (chassis radius + cargo half-diagonal,
      # ~0.3696m). Every such path re-triggered the controller's reactive
      # stop almost immediately, producing a 3200+ replan-cycle thrash
      # against a live test (see isaac_robot.md Session 15).
      #
      # First fix attempt set this to 0.37, matching CARRY_OBSTACLE_STOP_RANGE
      # exactly -- live-tested and wrong: the instant the controller's
      # reactive check stops the robot, the robot's own center sits right on
      # the planner's lethal-footprint boundary, so NavfnPlanner can't find
      # any valid path starting from where the robot already is ("failed to
      # create plan with tolerance 0.20", confirmed live).
      # Second attempt used 0.30 (0.07m margin below CARRY_OBSTACLE_STOP_RANGE
      # ~0.3696) -- still failed the same way. Root cause, confirmed live via
      # real ground-truth position query at the exact stall: the controller's
      # /scan-based stop distance (a single ray's raw depth, "0.35m") does
      # NOT equal the true geometric gap to the obstacle's nearest edge --
      # measured directly, chassis was only 0.287m from Cube_03's real top
      # edge at the moment /scan reported "0.35m". A single depth-camera ray
      # sampling a corner/edge at an angle doesn't measure the true nearest-
      # point distance the costmap's occupied cells are built from. 0.07m of
      # margin wasn't enough to absorb that ~0.06m sensing/geometry gap.
      # Widened margin substantially (0.37 -> 0.20, ~0.17m below
      # CARRY_OBSTACLE_STOP_RANGE) to comfortably survive this class of
      # discrepancy, not just this one measured instance of it.
      robot_radius: 0.20
      resolution: 0.1                  # matches CELL_SIZE used
                                         # throughout the rest of this
                                         # project's occupancy grid work
      rolling_window: true
      width: 10                        # generous vs. the real ~5.5x6.5m
      height: 10                        # isolated-world extent
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.8
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Session 15: kept comfortably PAST CARRY_OBSTACLE_STOP_RANGE
        # (~0.3696m, see robot_radius comment above) so the cost gradient
        # still discourages routes that would come close enough to
        # re-trigger the controller's reactive stop -- robot_radius itself
        # was deliberately pulled back BELOW that threshold instead (for
        # start-pose validity), so this is what actually keeps planned
        # paths biased away from the danger zone.
        inflation_radius: 0.5
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [0.3, 0.0, 25.0]       # angular term raised to match
                                        # FollowPath.max_angular_accel --
                                        # this node is OPEN_LOOP (uses its
                                        # own last output, not real odom,
                                        # so it doesn't hit the same
                                        # stuck-feedback deadlock RPP did),
                                        # but a lower cap here would just
                                        # re-throttle RPP's bigger step
                                        # right back down before it ever
                                        # reached the wheels
    max_decel: [-0.3, 0.0, -25.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
