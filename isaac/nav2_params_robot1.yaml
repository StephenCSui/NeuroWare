# Nav2 params for Robot 1, adapted from the real installed Nav2 Humble
# default (/opt/ros/humble/share/nav2_bringup/params/nav2_params.yaml) --
# not written from scratch. Meant to be launched with
# `ros2 launch nav2_bringup navigation_launch.py` (NOT bringup_launch.py --
# no AMCL/map_server here, since this robot has ground-truth odometry
# from the sim, no localization/SLAM needed). global_frame is "odom"
# everywhere instead of "map" for the same reason -- odom IS the map in
# this setup, and both costmaps use rolling_window instead of a static
# map layer.
#
# Robot geometry: robot_radius 0.168 = hypot(0.15, 0.075), the real
# chassis half-extents from base.usda (confirmed earlier this session,
# same value as occupancy_grid.rotation_swept_radius() with no cargo).
# Speed limits: this robot's real max wheel speed is ~5 rad/s * 0.04m
# wheel radius = ~0.2 m/s (Base_speed/WHEEL_RADIUS used throughout this
# session's other scripts) -- much slower than the turtlebot3 defaults
# (0.26 m/s) this file was adapted from, so velocity/acceleration/
# "stopped" thresholds are all scaled down accordingly, not left at
# turtlebot3 scale.

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2   # scaled down from 0.5 -- this
                                        # robot's whole world is ~5.5m
                                        # across, project convention is
                                        # small-scale/tight tolerances
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1          # tighter than the 0.25 default,
      yaw_goal_tolerance: 0.15        # matching this project's small-
                                        # scale/tight-tolerance convention
                                        # (not as tight as the hand-rolled
                                        # scripts' 0.01m/0.002rad, since
                                        # that's Nav2's own controller
                                        # precision, not our exact-turn
                                        # primitive)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.15                 # real max ~0.2 m/s (5 rad/s wheel
                                        # speed * 0.04m radius, confirmed
                                        # this session), kept under that
                                        # for margin
      max_vel_y: 0.0
      max_vel_theta: 1.0              # under the real differential max
                                        # (~2.3 rad/s at full opposite
                                        # wheel speed, track width 0.174m)
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.3                  # this robot ramps to full speed
                                        # over ~1.5s (RAMP_STEPS=90 in the
                                        # hand-rolled scripts) -- far
                                        # gentler than turtlebot3's 2.5,
                                        # scaled to match real behavior
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.3
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.02    # scaled way down from 0.25 --
                                        # that default is ABOVE this
                                        # robot's real max speed (0.2),
                                        # which would make it register as
                                        # "stopped" at all times
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.05
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.05
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# No static_layer/map_server -- this robot has no prebuilt map, only
# live sensing (the /scan topic synthesized from the 4 corner depth
# cameras, see nav2_bridge_robot1.py). rolling_window replaces the need
# for fixed map bounds.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 6                        # >= 2x SCAN_MAX_RANGE (3.0m) so
      height: 6                        # the full scan radius fits
      resolution: 0.05
      robot_radius: 0.168
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25         # scaled down from 0.55 -- this
                                         # robot/world is small-scale,
                                         # project convention is tight
                                         # tolerances, not a wide margin.
                                         # Must exceed the robot's real
                                         # inscribed radius (Nav2 computed
                                         # 0.174 from robot_radius=0.168 --
                                         # confirmed live via a real
                                         # startup warning when this was
                                         # 0.15, smaller than that) or the
                                         # inflation zone never actually
                                         # extends past the robot's own
                                         # body.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0      # matches SCAN_MAX_RANGE
          raytrace_min_range: 0.0
          obstacle_max_range: 2.8
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.168
      resolution: 0.1                  # matches CELL_SIZE used
                                         # throughout the rest of this
                                         # project's occupancy grid work
      rolling_window: true
      width: 10                        # generous vs. the real ~5.5x6.5m
      height: 10                        # isolated-world extent
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.8
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [0.3, 0.0, 1.5]
    max_decel: [-0.3, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
